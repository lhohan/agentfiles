# Sandbox EPERM Halt Extension config.
# Comments must be whole-line comments (lines whose trimmed content starts
# with # or ;). Inline comments are not parsed.

# Halt the agent for the current turn after this many EPERM ("Operation not
# permitted") tool errors accumulate within a single turn. The count resets
# each turn.
#
#   threshold = 1   -> halt on the first EPERM (original behavior)
#   threshold = 3   -> halt after the third EPERM in the same turn
#   threshold = off -> disable EPERM checking entirely (no counting, no halt)
#
# Valid values: a positive integer (>= 1) or the literal "off".
threshold = 3
