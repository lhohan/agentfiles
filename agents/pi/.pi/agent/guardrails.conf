# Example command guardrails for Pi bash tool calls.
# Comments must be whole-line comments.

[block-jj-squash]
mode = block
match = \bjj squash\b
reason = Protect working-copy history

[block-jj-abandon]
mode = block
match = \bjj abandon\b
reason = Protect working-copy history

[block-jj-restore]
mode = block
match = \bjj restore\b
reason = Protect working-copy changes

[block-jj-split]
mode = block
match = \bjj split\b
reason = Protect jj rules. The LLM should use jj commit with files specified

[warn-rm-rf]
mode = warn
match = \brm\s+-rf\b
reason = Destructive recursive delete

[warn-force-push]
mode = warn
match = \bgit push\b.*\s--force(?:-with-lease)?\b|\bjj git push\b.*\s--force\b
reason = Force push can rewrite published history

[warn-reset-hard]
mode = warn
match = \bgit reset\b.*\s--hard\b
reason = Hard reset discards uncommitted changes

# Example of disabling a same-name global rule in one project.
[disable-example]
mode = off
match = .*
