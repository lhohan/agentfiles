provider = "mistral"
alias = "review"
temperature = 0.3
thinking = "max"

[[models]]
name = "mistral-medium-3.5"
provider = "mistral"
alias = "brainstorming"
temperature = 0.9
thinking = "low"

[[models]]
name = "kimi-k2.7-code"
