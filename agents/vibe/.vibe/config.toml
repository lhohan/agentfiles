[[tts_models]]
name = "voxtral-mini-tts-latest"
provider = "mistral"
alias = "voxtral-tts"
voice = "gb_jane_neutral"
response_format = "wav"

# Start with the default (max_chars = 40000, default_commit_count = 5) and adjust based on:
#   Project size (increase for large codebases).
#   Privacy needs (decrease for sensitive repos).
#   Performance (reduce if Vibe is slow to start).
[project_context]
# Impact:
#   Higher values (e.g., 10+): More historical context → Better for debugging or understanding evolution, but adds noise.
#   Lower values (e.g., 1–3): Focuses on recent changes → Faster, but may miss older relevant commits.
default_commit_count = 5
# Impact:
#   Higher values (e.g., 80,000–100,000): More context → Better understanding of large codebases, but higher token usage and potential latency.
#   Lower values (e.g., 10,000–20,000): Less context → Faster, cheaper, but may miss relevant details.
# For privacy: Set to 0 to disable Git history entirely.
max_chars = 40000
max_doc_bytes = 32768      # Max bytes per file (default: 32KB)
truncation_buffer = 1000   # Buffer for truncating files (default: 1000)
max_depth = 3              # Max directory depth to scan (default: 3)
max_files = 1000           # Max files to include (default: 1000)
max_dirs_per_level = 20    # Max directories per level (default: 20)
timeout_seconds = 2.0

[session_logging]
save_dir = "~/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.skill]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.exit_plan_mode]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.task]
permission = "ask"
allowlist = [
    "explore",
]
denylist = []
sensitive_patterns = []

[tools.search_replace]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_content_size = 100000
create_backup = false
fuzzy_threshold = 0.9

[tools.bash]
permission = "ask"
allowlist = [
    "cd",
    "echo",
    "git diff",
    "git log",
    "git status",
    "jj",
    "tree",
    "whoami",
    "cat",
    "file",
    "find",
    "head",
    "ls",
    "pwd",
    "stat",
    "tail",
    "uname",
    "wc",
    "which",
]
denylist = [
