[[transcribe_providers]]
name = "mistral"
api_base = "wss://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[transcribe_models]]
name = "voxtral-mini-transcribe-realtime-2602"
provider = "mistral"
alias = "voxtral-realtime"
sample_rate = 16000
encoding = "pcm_s16le"
language = "en"
target_streaming_delay_ms = 500

[[tts_providers]]
name = "mistral"
api_base = "https://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[tts_models]]
name = "voxtral-mini-tts-latest"
provider = "mistral"
alias = "voxtral-tts"
voice = "gb_jane_neutral"
response_format = "wav"

[project_context]
default_commit_count = 5
max_chars = 40000
max_doc_bytes = 32768
truncation_buffer = 1000
max_depth = 3
max_files = 1000
max_dirs_per_level = 20
timeout_seconds = 2.0

[session_logging]
save_dir = "~/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.skill]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.exit_plan_mode]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.task]
permission = "always"
allowlist = [
    "explore",
]
denylist = []
sensitive_patterns = []

